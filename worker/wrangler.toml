name = "trippick-ai"
main = "src/index.js"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 0.1

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "842301"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "PAYMENT_RATE_LIMITER"
namespace_id = "842302"

  [ratelimits.simple]
  limit = 10
  period = 60

[vars]
ALLOWED_ORIGIN = "https://jwc95090-hash.github.io,http://127.0.0.1:5501,http://localhost:5501,http://127.0.0.1:5500,http://localhost:5500"
TOSS_ORDER_AMOUNT = "71200"
