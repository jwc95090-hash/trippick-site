<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호스트 로그인 | TRIPPICK</title><link rel="stylesheet" href="admin.css"></head>
<body class="host-login"><main class="host-login-card"><p class="host-eyebrow">TRIPPICK HOST</p><h1>관리자 로그인</h1><p>승인된 관리자 계정만 회원·상담 정보를 볼 수 있습니다.</p><form id="hostLoginForm"><label>이메일<input id="email" type="email" required autocomplete="email"></label><label>비밀번호<input id="password" type="password" required autocomplete="current-password"></label><p id="message" aria-live="polite"></p><button class="host-btn" type="submit">로그인</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script>const db=supabase.createClient(TRIPPICK_SUPABASE.url,TRIPPICK_SUPABASE.publishableKey);const q=new URLSearchParams(location.search);const msg=document.getElementById('message');if(q.get('error')==='forbidden')msg.textContent='관리자 권한이 없는 계정입니다.';document.getElementById('hostLoginForm').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const{error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent='이메일 또는 비밀번호를 확인해 주세요.';return}const{data:isAdmin}=await db.rpc('is_host_admin');if(!isAdmin){await db.auth.signOut();msg.textContent='관리자 권한이 없는 계정입니다.';return}location.replace(q.get('next')||'admin-camp.html')});</script></body></html>
